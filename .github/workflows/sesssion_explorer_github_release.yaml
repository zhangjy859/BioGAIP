name: session_explorer Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: session_explorer-windows-amd64.exe
            use_icon: true
          - os: ubuntu-latest
            artifact_name: session_explorer-linux-amd64
            use_icon: false
          - os: macos-latest
            artifact_name: session_explorer-macos-amd64
            use_icon: false

    defaults:
      run:
        working-directory: bioGen/web_v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk upx-ucl

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx --no-progress

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller -F --windowed --clean --upx-dir "C:\ProgramData\chocolatey\bin" --icon=session_explorer.ico session_explorer.py
          Move-Item -Path "dist\session_explorer.exe" -Destination "dist\${{ matrix.artifact_name }}"

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller -F --windowed --clean --strip session_explorer.py
          mv dist/session_explorer dist/${{ matrix.artifact_name }}

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller -F --windowed --clean session_explorer.py
          mv dist/session_explorer dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bioGen/web_v2/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true