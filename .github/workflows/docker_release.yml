name: Release to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Instantly free up ~20GB of disk space by removing unused pre-installed environments
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ONNX requirement for bioag
        run: |
          wget -qO bioGen/docker/bio_ag/onnx.tar.gz https://chroma-onnx-models.s3.amazonaws.com/all-MiniLM-L6-v2/onnx.tar.gz

      - name: Build, Push & Stream to Tar.gz
        run: |
          REF=${GITHUB_REF_NAME:-latest}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          APPS=("bioag:bioGen/docker/bio_ag" "bioworker:bioGen/docker/bioWorker")
          ARCHS=("amd64" "arm64")
          
          for app in "${APPS[@]}"; do
            NAME="${app%%:*}"
            DIR="${app##*:}"
            IMAGE="ghcr.io/${OWNER}/${NAME}"
            
            echo "🚀 Pushing multi-arch ${NAME} to GHCR..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              -t ${IMAGE}:${REF} \
              --label "org.opencontainers.image.description=🚀 Quick Start: Run 'docker pull ${IMAGE}:${REF}' to deploy online. For offline, download .tar.gz from Actions." \
              ${DIR}
              
            echo "📦 Streaming offline .tar.gz for ${NAME} directly to disk..."
            for arch in "${ARCHS[@]}"; do
              FILE="${NAME}_${REF}_${arch}.tar.gz"
              echo "Building and compressing ${FILE}..."
              
              # Using dest=- pipes the tar output directly to standard output.
              # This streams it straight into gzip, completely avoiding the huge intermediate .tar file!
              docker buildx build \
                --platform linux/${arch} \
                -t ${IMAGE}:${REF}-${arch} \
                --output type=docker,dest=- \
                ${DIR} | gzip > ${{ github.workspace }}/${FILE}
            done
          done

      - name: Upload Offline Tarballs
        uses: actions/upload-artifact@v4
        with:
          name: Docker-Offline-Packages-${{ github.ref_name }}
          path: "*.tar.gz"
          retention-days: 14